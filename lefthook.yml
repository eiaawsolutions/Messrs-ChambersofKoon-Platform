# Write-time quality gates. Installed by `npm run prepare` (postinstall).
# These run BEFORE code lands, not after — see full-stack-engineer Phase 3 step 1.

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,css,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx}'
      run: npx eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    secrets:
      # Block any live-looking credential from entering history. Bootstrap
      # Infisical creds are the only permitted raw secrets, and they belong in
      # Railway env rather than the repo.
      run: node scripts/scan-secrets.mjs

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test

commit-msg:
  commands:
    conventional:
      run: npx commitlint --edit {1}
